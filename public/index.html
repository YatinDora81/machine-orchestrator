<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Command</title>
  <style>
    :root {
      --bg: #10110f;
      --surface: #181a16;
      --ink: #f4f1e8;
      --muted: #8f8b80;
      --line: rgba(244, 241, 232, 0.12);
      --lime: #d6f25c;
      --ink-on-lime: #1c2208;
      --ok: #b6e36a;
      --bad: #ff8d6b;
      --run: #f0b429;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(214, 242, 92, 0.08), transparent 55%),
        var(--bg);
      color: var(--ink);
      font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .app {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
      display: grid;
      gap: 22px;
    }
    header { display: grid; gap: 6px; }
    .kicker {
      margin: 0 0 6px;
      color: var(--lime);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
    h2 {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 6px 10px;
      color: var(--muted);
    }
    #status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    #status[data-state="running"] { color: var(--run); }
    #status[data-state="running"]::before { background: var(--run); box-shadow: 0 0 0 4px rgba(240, 180, 41, 0.15); }
    #status[data-state="ok"] { color: var(--ok); }
    #status[data-state="ok"]::before { background: var(--ok); }
    #status[data-state="bad"] { color: var(--bad); }
    #status[data-state="bad"]::before { background: var(--bad); }
    .composer, .terminal {
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .composer { padding: 14px; display: grid; gap: 12px; }
    label { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    textarea, pre { font: inherit; color: inherit; }
    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      background: #10110f;
      border: 1px solid var(--line);
      padding: 12px;
      outline: none;
    }
    textarea:focus { border-color: rgba(214, 242, 92, 0.7); }
    .actions { display: flex; align-items: center; gap: 12px; }
    #run {
      background: var(--lime);
      color: var(--ink-on-lime);
      border: 0;
      padding: 10px 18px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    #run:disabled { opacity: 0.55; cursor: wait; }
    .hint { color: var(--muted); font-size: 12px; }
    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
    }
    .chip {
      text-align: left;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
    }
    .chip strong { display: block; font-weight: 650; }
    .chip code {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip.selected, .chip:hover { border-color: rgba(214, 242, 92, 0.65); }
    .publish {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    input[type="text"] {
      width: 120px;
      background: #10110f;
      border: 1px solid var(--line);
      color: inherit;
      font: inherit;
      padding: 10px 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: rgba(214, 242, 92, 0.7); }
    label.plain {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      text-transform: none;
      letter-spacing: 0;
      font-size: 13px;
      line-height: 1.4;
    }
    button.go, button.ghost {
      font: inherit;
      cursor: pointer;
    }
    button.go {
      background: var(--lime);
      color: var(--ink-on-lime);
      border: 0;
      padding: 10px 14px;
      font-weight: 750;
    }
    button.go:disabled { opacity: 0.55; cursor: wait; }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 8px 12px;
    }
    .service-error { margin: 0; color: var(--bad); }
    .service-error:empty { display: none; }
    .service {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }
    .service .meta { flex: 1; min-width: 200px; display: grid; gap: 2px; }
    .service .meta span, .service .meta small { color: var(--muted); }
    .service a { color: var(--lime); word-break: break-all; }
    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .terminal-bar #status {
      margin-left: auto;
      border: 0;
      background: transparent;
      padding: 0;
      letter-spacing: 0;
      text-transform: none;
      font-size: 13px;
    }
    .dots { display: inline-flex; gap: 5px; }
    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: block;
      background: #3a3d34;
    }
    .dots i:nth-child(1) { background: #ff8d6b; }
    .dots i:nth-child(2) { background: #f0b429; }
    .dots i:nth-child(3) { background: #d6f25c; }
    pre {
      margin: 0;
      min-height: 280px;
      max-height: 520px;
      overflow: auto;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    pre.empty::before {
      content: "Output shows up here.";
      color: var(--muted);
    }
    @media (max-width: 640px) {
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <p class="kicker">This server</p>
      <h1>Run a command</h1>
    </header>

    <section class="composer">
      <label for="command">Command</label>
      <textarea id="command" spellcheck="false" placeholder="Paste a command"></textarea>
      <div class="actions">
        <button id="run" type="button">Run</button>
        <span class="hint">Ctrl + Enter</span>
      </div>
    </section>

    <section>
      <h2>Suggestions</h2>
      <div id="suggestions" class="suggestions"></div>
    </section>

    <section>
      <h2>Published services</h2>
      <div class="composer">
        <label for="port">Local port</label>
        <div class="publish">
          <input id="port" type="text" inputmode="numeric" autocomplete="off" placeholder="3000" spellcheck="false">
          <button id="publish" class="go" type="button">Publish</button>
        </div>
        <label class="plain" for="strip">
          <input id="strip" type="checkbox" checked>
          <span>Server listens at /. Requests to /p/PORT/ are forwarded as /. Turn this off when the server was started with base /p/PORT/, like the Vite suggestion.</span>
        </label>
        <p id="service-error" class="service-error"></p>
        <div id="services"></div>
      </div>
    </section>

    <section class="terminal">
      <div class="terminal-bar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        Output
        <div id="status" data-state="idle">Idle</div>
      </div>
      <pre id="output" class="empty"></pre>
    </section>
  </div>
  <script>
    const SUGGESTIONS = [
      { name: "Node version", command: "node -v" },
      { name: "List files", command: "ls -la" },
      { name: "Where am I", command: "pwd" },
      { name: "System", command: "uname -a" },
      { name: "Create React app", command: "npx --yes create-react-app demo-cra" },
      { name: "Start React", command: "cd demo-cra && PORT=3000 HOST=127.0.0.1 BROWSER=none npm start" },
      { name: "Create Vite app", command: "npx --yes create-vite@latest demo-vite --no-interactive --overwrite --template react" },
      { name: "Start Vite", command: "cd demo-vite && npm install --include=dev && npm run dev -- --host 127.0.0.1 --port 5173 --strictPort --base /p/5173/" },
      { name: "Hello server on 8080", command: "node -e \"require('http').createServer((q,s)=>{s.setHeader('content-type','text/html');s.end('<h1>hello from 8080</h1><a href=\\\"/next\\\">next</a>')}).listen(8080,'127.0.0.1')\"" },
    ];

    const commandInput = document.querySelector("#command");
    const output = document.querySelector("#output");
    const button = document.querySelector("#run");
    const statusEl = document.querySelector("#status");
    const suggestions = document.querySelector("#suggestions");
    let pollTimer = null;

    function setStatus(state, label) {
      statusEl.dataset.state = state;
      statusEl.textContent = label;
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json" },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function show(job) {
      output.textContent = job.output || "";
      output.classList.toggle("empty", !job.output);
      if (job.status === "running") setStatus("running", "Running");
      else if (job.exitCode === 0) setStatus("ok", "Done");
      else setStatus("bad", "Exit " + job.exitCode);
      output.scrollTop = output.scrollHeight;
    }

    function watch(id) {
      clearInterval(pollTimer);
      const tick = async () => {
        const job = await api("/api/jobs/" + id);
        show(job);
        if (job.status !== "running") clearInterval(pollTimer);
      };
      pollTimer = setInterval(() => {
        tick().catch((err) => {
          output.textContent = err.message;
          output.classList.remove("empty");
          setStatus("bad", "Error");
          clearInterval(pollTimer);
        });
      }, 1000);
      tick().catch((err) => {
        output.textContent = err.message;
        output.classList.remove("empty");
        setStatus("bad", "Error");
        clearInterval(pollTimer);
      });
    }

    async function runCommand() {
      const command = commandInput.value.trim();
      if (!command) return;
      button.disabled = true;
      setStatus("running", "Running");
      output.classList.remove("empty");
      output.textContent = "Running…";
      try {
        const job = await api("/api/run", {
          method: "POST",
          body: JSON.stringify({ command, background: true }),
        });
        show(job);
        if (job.status === "running") watch(job.id);
      } catch (err) {
        output.textContent = err.message;
        setStatus("bad", "Error");
      } finally {
        button.disabled = false;
      }
    }

    for (const item of SUGGESTIONS) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      const title = document.createElement("strong");
      title.textContent = item.name;
      const code = document.createElement("code");
      code.textContent = item.command;
      chip.append(title, code);
      chip.addEventListener("click", () => {
        commandInput.value = item.command;
        for (const other of suggestions.children) other.classList.remove("selected");
        chip.classList.add("selected");
        commandInput.focus();
      });
      suggestions.appendChild(chip);
    }

    button.addEventListener("click", runCommand);
    commandInput.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        runCommand();
      }
    });

    const portInput = document.querySelector("#port");
    const publishButton = document.querySelector("#publish");
    const stripInput = document.querySelector("#strip");
    const serviceError = document.querySelector("#service-error");
    const serviceList = document.querySelector("#services");
    let servicesStamp = "";

    function serviceNote(route) {
      return route.strip ? "listening at /" : "listening at /p/" + route.port + "/";
    }

    function renderServices(data) {
      serviceList.replaceChildren();
      const published = new Set(data.routes.map((route) => route.port));
      if (!data.routes.length && !data.listeners.length) {
        const empty = document.createElement("p");
        empty.className = "hint";
        empty.textContent = "Start a server on 127.0.0.1, then publish its port. It shows up here as a link on this same URL.";
        serviceList.appendChild(empty);
        return;
      }
      for (const route of data.routes) {
        const row = document.createElement("div");
        row.className = "service";
        const meta = document.createElement("div");
        meta.className = "meta";
        const link = document.createElement("a");
        link.href = route.path;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = location.host + route.path;
        const detail = document.createElement("small");
        detail.textContent = (route.online ? "Up" : "Not up yet") + " · " + serviceNote(route);
        meta.append(link, detail);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "ghost";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => removeRoute(route.port));
        row.append(meta, remove);
        serviceList.appendChild(row);
      }
      for (const listener of data.listeners) {
        if (published.has(listener.port)) continue;
        const row = document.createElement("div");
        row.className = "service";
        const meta = document.createElement("div");
        meta.className = "meta";
        const title = document.createElement("strong");
        title.textContent = "Port " + listener.port + " is open";
        const detail = document.createElement("small");
        detail.textContent = listener.address + " · from a command you ran";
        meta.append(title, detail);
        const open = document.createElement("button");
        open.type = "button";
        open.className = "go";
        open.textContent = "Publish";
        open.addEventListener("click", () => publishPort(listener.port, stripInput.checked));
        row.append(meta, open);
        serviceList.appendChild(row);
      }
    }

    async function refreshServices() {
      try {
        const data = await api("/api/services");
        const stamp = JSON.stringify(data);
        if (stamp !== servicesStamp) {
          servicesStamp = stamp;
          renderServices(data);
        }
        serviceError.textContent = "";
      } catch (err) {
        serviceError.textContent = err.message;
      }
    }

    async function publishPort(port, strip) {
      publishButton.disabled = true;
      serviceError.textContent = "";
      try {
        await api("/api/routes", {
          method: "POST",
          body: JSON.stringify({ port: Number(port), strip }),
        });
        servicesStamp = "";
        await refreshServices();
      } catch (err) {
        serviceError.textContent = err.message;
      } finally {
        publishButton.disabled = false;
      }
    }

    async function removeRoute(port) {
      serviceError.textContent = "";
      try {
        await api("/api/routes/" + port, { method: "DELETE" });
        servicesStamp = "";
        await refreshServices();
      } catch (err) {
        serviceError.textContent = err.message;
      }
    }

    publishButton.addEventListener("click", () => {
      const port = Number(portInput.value.trim());
      publishPort(port, stripInput.checked);
    });
    portInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        publishPort(Number(portInput.value.trim()), stripInput.checked);
      }
    });
    refreshServices();
    setInterval(refreshServices, 2000);
  </script>
</body>
</html>
